[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_stars_contrib_mcp"]

[project]
name = "github-stars-contrib-mcp-server"
version = "0.2.0"
description = "MCP server for GitHub Stars contributions using the current REST Contributions API"
authors = [{name = "GitHub Stars MCP Team", email = "team@github-stars-mcp.dev"}]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "mcp>=2.1.1,<3",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "httpx>=0.28.1,<1",
    "tenacity>=9.1.4,<10",
    "structlog>=26.1.0,<27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.5,<0.17",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-asyncio>=1.4.0,<2",
    "mypy>=2.3.1,<3",
    "pre-commit>=4.6.2,<5",
]

[project.scripts]
github-stars-contrib-mcp-server = "github_stars_contrib_mcp.server:main"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing --cov-report=html --cov-report=xml:coverage.xml --cov-fail-under=30"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
markers = [
    "tools: mark tests that exercise MCP tool implementations",
    "client: mark tests that exercise the raw StarsClient",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
