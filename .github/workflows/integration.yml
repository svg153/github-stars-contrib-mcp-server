name: integration

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  stars-api:
    runs-on: ubuntu-latest
    env:
      STARS_API_TOKEN: ${{ secrets.STARS_API_TOKEN }}
      STARS_E2E_MUTATE: ${{ vars.STARS_E2E_MUTATE || '0' }}
      LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Stars integration tests
        run: pytest -q tests/integration
