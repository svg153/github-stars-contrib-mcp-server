name: integration

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  stars-api:
    runs-on: ubuntu-latest
    env:
      STARS_API_TOKEN: ${{ secrets.STARS_API_TOKEN }}
      STARS_E2E_MUTATE: ${{ vars.STARS_E2E_MUTATE || '0' }}
      LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Stars integration tests
        # Coverage is enforced by the always-on unit workflow. The isolated E2E
        # suite may legitimately skip most tests when STARS_API_TOKEN is absent.
        run: pytest -q tests/integration --no-cov
