name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".release/*.json"
  workflow_dispatch:
    inputs:
      tag:
        description: Canonical release tag matching pyproject.toml, for example v0.3.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || 'marker' }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require main source
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release workflow must execute from main, got ${GITHUB_REF}" >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build twine

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${REQUESTED_TAG}"
          else
            version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          PY
          )"
            tag="v${version}"
            marker=".release/${tag}.json"
            if [[ ! -f "${marker}" ]]; then
              echo "Expected release marker ${marker} is missing" >&2
              exit 1
            fi
          fi
          python scripts/check_release_version.py "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Run release quality gates
        run: |
          python scripts/quality_check.py
          python -m compileall -q src

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distributions
        run: python -m twine check dist/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-stars-contrib-mcp-server-${{ steps.release.outputs.tag }}
          path: dist/*
          if-no-files-found: error

      - name: Create immutable release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Tag ${RELEASE_TAG} already exists locally; refusing to move it" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists remotely; refusing to move it" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "${RELEASE_TAG}"
